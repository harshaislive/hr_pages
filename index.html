<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR Quick Pages</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #231f20;
        --muted: #6d665f;
        --paper: #f7f3ea;
        --panel: #fffdfa;
        --line: #d8d0c2;
        --accent: #2f6f57;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 3.5rem);
        line-height: 1;
        font-weight: 700;
      }

      p {
        max-width: 640px;
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .pages {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .page-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 76px;
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: inherit;
        text-decoration: none;
      }

      .page-link:hover {
        border-color: var(--accent);
      }

      .title {
        display: block;
        font-size: 1.05rem;
        font-weight: 700;
      }

      .path {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .arrow {
        flex: 0 0 auto;
        color: var(--accent);
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HR Quick Pages</h1>
      <p>A small home for standalone HTML pages. Add new pages inside the <code>pages</code> folder and link them here.</p>

      <ul class="pages">
        <li>
          <a class="page-link" href="pages/beforest-employee-onboarding.html">
            <span>
              <span class="title">Beforest Employee Onboarding</span>
              <span class="path">pages/beforest-employee-onboarding.html</span>
            </span>
            <span class="arrow" aria-hidden="true">-></span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
